4765625 10) rotate(0 71.82400512695312 40)"><text x="0" y="15.264000000000001" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1. 判断该tile是否为</text><text x="0" y="35.264" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">本rank shard</text><text x="0" y="55.264" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2. 若是，等待flag的</text><text x="0" y="75.264" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">counter为ws</text></g><g transform="translate(342.7086181640625 114.22225952148438) rotate(0 118.8559341430664 50)"><text x="0" y="15.264000000000001" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3. 发起multimem.ld.reduce</text><text x="0" y="35.264" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">4. 块内规约计算该tile的norm</text><text x="0" y="55.264" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">部分和放入GMEM中</text><text x="0" y="75.264" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">5. 对每个m_Tile的tile_m_counter</text><text x="0" y="95.264" font-family="Nunito, sans-serif, Segoe UI Emoji" font